<style>
:root{color-scheme:dark;--paper:#f4f0e9;--rose:#e6b4c5;--blue:#9fc7d2;font-family:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{min-height:100svh;display:flex;flex-direction:column;color:var(--paper);background:radial-gradient(ellipse at 15% 10%,#383047,transparent 45%),radial-gradient(ellipse at 85% 80%,#263a42,transparent 48%),#101118;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.17;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}
header{position:relative;z-index:1;padding:clamp(12px,2.5vh,24px) 5vw;font-size:.72rem;letter-spacing:.24em;font-weight:800}header span{color:var(--rose)}
main{position:relative;z-index:1;flex:1;display:grid;place-items:center;padding:10px 20px 18px}
.content{width:min(100%,1080px);text-align:center}
.eyebrow{color:#c8b5c6;letter-spacing:.3em;text-transform:uppercase;font-size:.65rem;font-weight:700}
h1{font-family:Manrope,system-ui,sans-serif;font-size:clamp(2.2rem,5.5vw,5rem);line-height:1.04;letter-spacing:-.075em;font-weight:800;margin:9px 0 clamp(18px,3vh,32px)}
h1 em{font-style:normal;color:var(--rose)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2vw,22px);text-align:left}
.choice{--accent:var(--rose);position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;min-height:clamp(195px,31vh,285px);padding:clamp(20px,2.7vw,32px);border:1px solid #ffffff35;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#ffffff10,#ffffff03);color:inherit;text-decoration:none;box-shadow:0 18px 48px #0004;transition:transform .3s,border-color .3s,box-shadow .3s}
.choice.digital{--accent:var(--blue)}
.choice:before{content:"";position:absolute;z-index:-1;width:70%;aspect-ratio:1;right:-23%;top:-67%;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);border-radius:50%;box-shadow:0 0 0 42px #ffffff04,0 0 0 84px #ffffff03;transition:transform .5s}
.choice:after{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 90% 0%,color-mix(in srgb,var(--accent) 19%,transparent),transparent 60%)}
.choice:hover,.choice:focus-visible{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 22px 60px #0007}
.choice:hover:before{transform:scale(1.2) rotate(10deg)}
.choice:focus-visible{outline:2px solid white;outline-offset:4px}
.choice small{font-size:.62rem;letter-spacing:.19em;text-transform:uppercase;color:#c9c3ce;font-weight:700}
.choice strong{font-family:Manrope,system-ui,sans-serif;font-size:clamp(2.25rem,4.8vw,4.7rem);line-height:1;letter-spacing:-.075em;font-weight:800;text-transform:uppercase}
.choice .bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}
.choice .desc{font-size:clamp(.84rem,1.4vw,1rem);line-height:1.4;color:#e0dce3;max-width:250px}
.choice .arrow{display:grid;place-items:center;flex:0 0 auto;width:clamp(48px,5vw,64px);height:clamp(48px,5vw,64px);border:1px solid var(--accent);border-radius:50%;font-size:2rem;color:var(--accent);background:#ffffff09;transition:transform .3s,background .3s}
.choice:hover .arrow,.choice:focus-visible .arrow{transform:translate(4px,-4px);background:#ffffff18}
footer{position:relative;z-index:1;text-align:center;color:#a8a5b0;font-size:.67rem;padding:10px 16px 14px}

/* Atmospheric portal transition — layered drifting vapor, not expanding circles */
.cloud-wipe{position:fixed;inset:0;z-index:1000;pointer-events:none;visibility:hidden;opacity:0;overflow:hidden;background:transparent;isolation:isolate}
.cloud-wipe .veil{position:absolute;inset:0;background:linear-gradient(130deg,#f2f0ee,#d7e5e8 58%,#f7f2ee);opacity:0}
.cloud-wipe .vapor{position:absolute;left:-40%;top:-45%;width:180%;height:190%;opacity:0;transform:translate3d(-24%,14%,0) scale(.75);will-change:transform,opacity;background:radial-gradient(ellipse at 15% 40%,#fff 0 9%,#ffffffd9 16%,transparent 38%),radial-gradient(ellipse at 42% 60%,#f6f0f5 0 13%,#f6f0f5a8 24%,transparent 44%),radial-gradient(ellipse at 74% 36%,#d9e8ec 0 11%,#e7f2f4ae 26%,transparent 47%),radial-gradient(ellipse at 84% 78%,#fff 0 8%,#fff9 23%,transparent 41%);filter:blur(clamp(18px,4vw,60px))}
.cloud-wipe .vapor:nth-child(2){animation-delay:.07s;transform:translate3d(25%,12%,0) scale(.72);filter:blur(clamp(25px,5vw,80px));mix-blend-mode:screen}
.cloud-wipe .vapor:nth-child(3){animation-delay:.14s;transform:translate3d(-12%,38%,0) scale(.8);filter:blur(clamp(12px,3vw,45px));background:radial-gradient(ellipse at 22% 72%,#fff 0 12%,transparent 42%),radial-gradient(ellipse at 63% 45%,#f5eff7 0 16%,transparent 46%),radial-gradient(ellipse at 85% 25%,#cfe7ee 0 9%,transparent 38%)}
body.leaving .cloud-wipe{visibility:visible;opacity:1}
body.leaving .cloud-wipe .veil{animation:cloud-veil 1.02s ease-in-out both}
body.leaving .cloud-wipe .vapor{animation:cloud-drift .98s cubic-bezier(.16,.65,.18,1) both}
body.leaving .content{animation:portal-dissolve .7s ease-out both}
@keyframes cloud-veil{0%,23%{opacity:0}75%{opacity:.8}100%{opacity:1}}
@keyframes cloud-drift{0%{opacity:0;transform:translate3d(-20%,16%,0) scale(.68)}28%{opacity:.85}75%{opacity:1;transform:translate3d(1%,-3%,0) scale(1.1)}100%{opacity:1;transform:translate3d(5%,-5%,0) scale(1.18)}}
@keyframes portal-dissolve{0%{opacity:1;filter:blur(0);transform:scale(1)}100%{opacity:.15;filter:blur(13px);transform:scale(.975)}}
@media(max-width:700px){main{padding:8px 15px 12px}h1{font-size:clamp(2.1rem,9vw,3.7rem);margin:8px 0 17px}.choices{grid-template-columns:1fr;gap:12px}.choice{min-height:clamp(155px,25svh,210px);padding:20px}.choice strong{font-size:clamp(2.3rem,9vw,3.7rem)}.choice .arrow{width:50px;height:50px}.eyebrow{font-size:.58rem}footer{font-size:.6rem}}
@media(max-height:680px) and (min-width:701px){header{padding-top:12px;padding-bottom:10px}main{padding:4px 20px 8px}h1{font-size:clamp(2.1rem,5vw,3.5rem);margin:5px 0 14px}.choice{min-height:190px;padding:20px}.choice strong{font-size:clamp(2.1rem,4vw,3.2rem)}.choice .arrow{width:48px;height:48px}footer{padding:6px}}
@media(max-height:590px) and (max-width:700px){.choice{min-height:135px;padding:14px}.choice strong{font-size:2rem}.eyebrow{display:none}h1{font-size:2rem;margin:4px 0 12px}header{padding:9px 15px}footer{padding:5px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}body.leaving .cloud-wipe{opacity:0}}
</style>
</head>

<script>
(function(){
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 document.querySelectorAll('.choice').forEach(link=>{
  link.addEventListener('click',function(event){
   if(event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||reduced)return;
   event.preventDefault();
   if(document.body.classList.contains('leaving'))return;
   document.body.classList.add('leaving');
   const destination=link.href;
   window.setTimeout(()=>{window.location.assign(destination)},950);
  });
 });
 window.addEventListener('pageshow',()=>document.body.classList.remove('leaving'));
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')document.body.classList.remove('leaving')});
})();
</script></body>
